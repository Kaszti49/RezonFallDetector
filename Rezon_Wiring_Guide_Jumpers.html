<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezon Jumper Wiring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eeebe5; --panel: #f8f6f2; --card: #ffffff; --ink: #2a2c2e; --muted: #7b7f83; --faint: #a9aaa7;
    --line: #e0dbd2; --line2: #d1cbc0; --teal: #5f8f8b; --teal-soft: #e4eeec; --amber: #a7783e; --amber-soft: #f6eddf;
    --red: #a9655b; --red-soft: #f5e6e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; font-size: 13.5px; line-height: 1.45; }
  .app { display: grid; grid-template-columns: 440px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
  .brand .row { display: flex; align-items: baseline; justify-content: space-between; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .brand h1 b { color: var(--teal); letter-spacing: 1.5px; }
  .brand .count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .dot { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line2); background: var(--card);
    font: 500 9.5px "IBM Plex Mono", monospace; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .dot.done { background: #e9e6df; color: var(--faint); }
  .dot.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .dot.phase-start { margin-left: 6px; }
  .card { flex: 1; overflow-y: auto; padding: 16px 20px 20px; min-height: 0; }
  .phase { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 1.2px; text-transform: uppercase; color: var(--teal); }
  .card h2 { margin: 3px 0 10px; font-size: 20px; line-height: 1.25; letter-spacing: -.2px; }
  .stations { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .st { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 999px;
    border: 1px solid var(--line2); background: var(--card); font-size: 12px; font-weight: 500; }
  .st svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .st.solder { color: var(--red); border-color: #e6c9c3; background: var(--red-soft); }
  .st.meter { color: var(--amber); border-color: #ead7b8; background: var(--amber-soft); }
  .st.cut, .st.screw, .st.laptop { color: #586a7a; border-color: #cfd8df; background: #eef2f5; }
  .st.hands, .st.plug { color: var(--teal); border-color: #c6dbd8; background: var(--teal-soft); }
  .lead { margin: 0 0 12px; color: #45484b; }
  .sec { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .op { display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; padding: 7px 6px; border-bottom: 1px solid var(--line); border-radius: 4px; }
  .op:hover { background: #f1eee8; }
  .op .n { font: 600 11px "IBM Plex Mono", monospace; color: var(--muted); padding-top: 1px; }
  .op .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .end { font-size: 12.5px; }
  .end .h { display: inline-block; min-width: 34px; font: 600 11.5px "IBM Plex Mono", monospace; background: var(--ink); color: #fff; border-radius: 3px; padding: 0 4px; text-align: center; margin-right: 5px; }
  .end .h.sol { background: var(--red); }
  .end .what { color: #3c3f42; }
  .end .what b { font-weight: 600; }
  .arrow { color: var(--faint); font-size: 11px; margin: 1px 0 1px 12px; }
  .meta { font: 11px "IBM Plex Mono", monospace; color: var(--muted); margin-top: 3px; }
  .trim { display: inline-block; margin-top: 3px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; padding: 1px 5px; border-radius: 3px; background: var(--amber-soft); color: var(--amber); border: 1px solid #ead7b8; }
  .trim.ok { background: var(--teal-soft); color: #3f6663; border-color: #c6dbd8; }
  ul.notes { margin: 0; padding-left: 17px; }
  ul.notes li { margin: 3px 0; }
  .warn { margin-top: 10px; border: 1px solid #e6c9c3; background: var(--red-soft); color: #7e4a42; border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
  .tip { margin-top: 10px; border: 1px solid #c6dbd8; background: var(--teal-soft); color: #3f6663; border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
  .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 12px; }
  table.tot { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tot td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.tot td.q { font: 600 12px "IBM Plex Mono", monospace; text-align: right; width: 54px; }
  nav { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  nav button { flex: 1; height: 38px; border-radius: 7px; border: 1px solid var(--line2); background: var(--card); color: var(--ink);
    font: 600 13px "IBM Plex Sans", sans-serif; cursor: pointer; }
  nav button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  nav button:disabled { opacity: .35; cursor: default; }
  main { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #f6f4f0 0%, #ebe7e0 75%); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #gl:active { cursor: grabbing; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font: 500 11px "IBM Plex Mono", monospace;
    color: var(--ink); background: rgba(255,255,255,.92); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; margin-top: -6px; }
  .lbl.part { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 11.5px; }
  .lbl.pin { font-size: 10.5px; padding: 0 5px; background: rgba(42,44,46,.9); color: #fff; border-color: transparent; }
  .lbl.pin b { color: #f2d49b; font-weight: 600; margin-right: 4px; }
  .lbl.call { background: rgba(255,255,255,.95); border-color: var(--teal); color: #35514e; font-family: "IBM Plex Sans", sans-serif; font-size: 11.5px; padding: 3px 8px; }
  .lbl.call::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 1px; height: 6px; background: var(--teal); }
  .toolbar { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .toolbar button { height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--line2); background: rgba(255,255,255,.92);
    font: 500 12px "IBM Plex Sans", sans-serif; color: var(--ink); cursor: pointer; }
  .toolbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .viewtag { position: absolute; top: 16px; left: 16px; font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 1px; text-transform: uppercase;
    background: rgba(255,255,255,.9); border: 1px solid var(--line2); border-radius: 5px; padding: 4px 8px; color: #4b4e51; }
  .legend { position: absolute; left: 14px; bottom: 14px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; display: grid; grid-template-columns: repeat(2, auto); gap: 3px 14px; font-size: 11px; color: #4b4e51; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .help { position: absolute; right: 14px; bottom: 14px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.8); padding: 4px 8px; border-radius: 6px; }
  #err { position: absolute; top: 60px; left: 14px; right: 14px; color: #8c4a40; font: 12px monospace; white-space: pre-wrap; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; height: auto; min-height: 100vh; }
    main { order: 1; height: 52vh; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    .legend, .help { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="row"><h1><b>REZON</b> &nbsp;jumper wiring</h1><span class="count" id="count"></span></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="card" id="card"></div>
    <nav>
      <button id="prev">← Back</button>
      <button id="next" class="primary">Next →</button>
    </nav>
  </aside>
  <main>
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div class="viewtag" id="viewtag">No perfboard · no breadboard</div>
    <div class="toolbar">
      <button id="bLabels" class="on">Labels</button>
      <button id="bXray" class="on">X-ray</button>
      <button id="bSpin">Spin</button>
      <button id="bReset">Reset view</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="help">drag = rotate · right-drag = pan · scroll = zoom · ← → = steps</div>
    <div id="err"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e) + '\n'; });

/* ======================= palette ======================= */
const C = {
  socket: '#2f3133', pin: '#c9b37a', housing: '#2b2d2f',
  esp: '#6f8299', espCan: '#b9bdc1', click: '#8ea38a', sim: '#ad8279', pcm: '#8e86a3', pam: '#9b9a72',
  boost: '#73998f', holder: '#47494c', cell: '#c9b48f', geo: '#ad8a68', geoTop: '#7a6450',
  spk: '#8b8884', spkCone: '#5d5b58', rocker: '#55585b', cap: '#5b6670', capTop: '#9aa3ab', res: '#d6c7a6',
  term: '#6d8796', usb: '#9aa0a4', chip: '#3a3d40',
  base: '#e8e3d9', lid: '#ddd6ca', band: '#6f9894', slot: '#8a857c', collar: '#86a39f', print: '#d6d0c4', print2: '#c9c2b4'
};
const NET = { gnd: '#3d4044', v5: '#c58c5c', vbat: '#b3665b', v33: '#c7ab5f', spi: '#6c8dae', i2s: '#8a7fae', uart: '#5d9a8b',
  audio: '#a6799a', line: '#c296b4', io: '#7c9a62', geoP: '#b07a6a', geoN: '#a7a49d' };
const LEGEND = [['GND', NET.gnd], ['5 V', NET.v5], ['VBAT (4.0 V, SIM868)', NET.vbat], ['3V3', NET.v33], ['SPI (ADC)', NET.spi], ['I²S (audio)', NET.i2s],
  ['UART (SIM868)', NET.uart], ['Line audio', NET.line], ['Speaker', NET.audio], ['LED / button', NET.io], ['Geophone', NET.geoP]];

/* ======================= three setup ======================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 5000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2c6, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(-160, 320, 200); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -320, right: 320, top: 260, bottom: -260, near: 50, far: 900 });
sun.shadow.bias = -0.0006; scene.add(sun);
const under = new THREE.DirectionalLight(0xffffff, 0.35); under.position.set(60, -300, 80); scene.add(under);
const FLOOR_Y = -4.4;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: 0.10 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = FLOOR_Y; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(1200, 120, 0xd6d0c5, 0xe2ddd4); grid.position.y = FLOOR_Y - 0.05;
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

const v = (x, y, z) => new THREE.Vector3(x, y, z);
const toLin = hex => new THREE.Color(hex).convertSRGBToLinear();
function mat(color, extra = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color: toLin(color), roughness: 0.82, metalness: 0.02, transparent: true, opacity: 1 }, extra)); }
function mesh(geo, color, extra) { const m = new THREE.Mesh(geo, mat(color, extra)); m.castShadow = true; m.receiveShadow = true; return m; }
function box(w, h, d, color, x, y, z, extra) { const m = mesh(new THREE.BoxGeometry(w, h, d), color, extra); m.position.set(x, y, z); return m; }
function boxB(w, h, d, color, x, yb, z, extra) { return box(w, h, d, color, x, yb + h / 2, z, extra); }
function cyl(r, h, color, x, yb, z, seg = 28, extra) { const m = mesh(new THREE.CylinderGeometry(r, r, h, seg), color, extra); m.position.set(x, yb + h / 2, z); return m; }
const METAL = { metalness: 0.6, roughness: 0.35 };

/* ======================= pins (every connection point) =======================
   Units mm. y up, base floor top = 0, +z = front of the case, +x = right.
   type: up   = male pin pointing up (a female jumper end slides down onto it)
         down = male pin pointing down (Click on its stilts)
         sock = female socket on the SIM868 (a male jumper end goes in, along -z)
         term = Click screw terminal (stripped wire enters from +x)
         pad  = solder point            jn = mid-air jumper junction (lid leads)  */
const PIN = {};
function P(id, tag, what, x, y, z, type, lid) { PIN[id] = { id, tag, what, base: v(x, y, z), type, lid: !!lid }; }
function exitOf(p) { const b = p.base;
  if (p.type === 'up') return v(b.x, b.y + 14, b.z);
  if (p.type === 'down') return v(b.x, b.y - 14, b.z);
  if (p.type === 'sock') return v(b.x, b.y, b.z + 14);
  return b.clone(); }

// ESP32-S3-DevKitC-1, lying UPSIDE DOWN (pins up) in its tray. J1 row at the front, USB-C to the right.
const EX = -30, EZ = -26, ESP_PCB = 8, ESP_PIN_BASE = 12.1;
const J1N = ['3V3', '3V3', 'EN', 'GPIO4', 'GPIO5', 'GPIO6', 'GPIO7', 'GPIO15', 'GPIO16', 'GPIO17', 'GPIO18', 'GPIO8', 'GPIO3', 'GPIO46', 'GPIO9', 'GPIO10', 'GPIO11', 'GPIO12', 'GPIO13', 'GPIO14', '5V', 'GND'];
const J3N = ['GND', 'TX', 'RX', 'GPIO1', 'GPIO2', 'GPIO42', 'GPIO41', 'GPIO40', 'GPIO39', 'GPIO38', 'GPIO37', 'GPIO36', 'GPIO35', 'GPIO0', 'GPIO45', 'GPIO48', 'GPIO47', 'GPIO21', 'GPIO20', 'GPIO19', 'GND', 'GND'];
const espX = n => EX - 29.21 + 2.54 * n, J1Z = EZ + 11.43, J3Z = EZ - 11.43;
for (let n = 1; n <= 22; n++) {
  P('J1-' + n, 'J1-' + n, `<b>ESP32-S3</b> ${J1N[n - 1]}`, espX(n), ESP_PIN_BASE, J1Z, 'up');
  P('J3-' + n, 'J3-' + n, `<b>ESP32-S3</b> ${J3N[n - 1]}`, espX(n), ESP_PIN_BASE, J3Z, 'up');
}
// MikroE ADC 15 Click on three printed stilts, pins DOWN, screw terminals up and facing right.
const CX = 8, CZ = 4, CLICK_PCB = 22, CLICK_PIN_BASE = 19.5;
const ckX = k => CX - 20.13 + (k - 1) * 2.54, CKN = CZ - 10.43, CKW = CZ + 11.43;
function ck(id, name, row, k, what) { P(id, name, `<b>Click</b> ${row === 'N' ? 'back' : 'front'} row · ${what}`, ckX(k), CLICK_PIN_BASE, row === 'N' ? CKN : CKW, 'down'); }
ck('CK-CS2', 'CS2', 'N', 9, 'clock-chip select'); ck('CK-INT', 'INT', 'N', 8, 'DRDY'); ck('CK-GNDb', 'GND', 'N', 2, 'ground');
ck('CK-RST', 'RST', 'W', 8, 'reset'); ck('CK-CS1', 'CS1', 'W', 7, 'ADC select'); ck('CK-SCK', 'SCK', 'W', 6, 'clock'); ck('CK-SDO', 'SDO', 'W', 5, 'MISO');
ck('CK-SDI', 'SDI', 'W', 4, 'MOSI'); ck('CK-3V3', '3V3', 'W', 3, 'supply'); ck('CK-GNDf', 'GND', 'W', 2, 'ground');
const TX_ = CX + 17.05 + 3.5, TY = CLICK_PCB + 1.6 + 3.3;
const TERMZ = { 'CH1−': CZ - 6.73, 'CH1+': CZ - 2.73, 'CH2+': CZ + 4.27, 'CH2−': CZ + 8.27 };
P('T-CH1-', 'CH1−', '<b>Click</b> screw terminal', TX_, TY, TERMZ['CH1−'], 'term'); P('T-CH1+', 'CH1+', '<b>Click</b> screw terminal', TX_, TY, TERMZ['CH1+'], 'term');
P('T-CH2+', 'CH2+', '<b>Click</b> screw terminal', TX_, TY, TERMZ['CH2+'], 'term'); P('T-CH2-', 'CH2−', '<b>Click</b> screw terminal', TX_, TY, TERMZ['CH2−'], 'term');
// PCM5102A DAC, flat in a pocket, its 6-pin header soldered pins UP, plus one pin on the L line-out pad
const PX = -50, PZ = 6, MOD_PCB = 3, MOD_PIN_BASE = 7.1, PHZ = PZ - 12.5;
[['VIN', -6.35], ['GND', -3.81], ['LCK', -1.27], ['DIN', 1.27], ['BCK', 3.81], ['SCK', 6.35]].forEach(([n, dx]) => P('PCM-' + n, n, '<b>PCM5102A</b> header', PX + dx, MOD_PIN_BASE, PHZ, 'up'));
P('PCM-JACK', 'line out', '<b>PCM5102A</b> 3.5 mm line-out jack', PX, MOD_PCB + 4.35, PZ + 14.8, 'pad');
// ZK-502M Bluetooth / AUX amp (TPA3116D2, 5–24 V), on foam pads in the free front-right area.
// Size unknown: drawn as a 36 × 30 mm placeholder. Power into its DC jack, speaker on its L screw-terminal pair (R stays empty), audio in on its AUX jack.
const ZX = 45, ZZ = 39, ZY = 12;
P('ZK-AUX', 'AUX in', '<b>ZK-502M</b> 3.5 mm AUX jack', ZX - 18, ZY + 4, ZZ - 2, 'pad');
P('ZK-5V', 'jack +', '<b>ZK-502M</b> DC jack centre pin (+5 V): 5.5 × 2.1 plug, or its leg underneath', ZX - 12, ZY + 3, ZZ + 13, 'pad'); P('ZK-GND', 'jack −', '<b>ZK-502M</b> DC jack sleeve (−): 5.5 × 2.1 plug, or its leg underneath', ZX - 8, ZY + 3, ZZ + 13, 'pad');
P('ZK-LP', 'L', '<b>ZK-502M</b> speaker terminal L (first of the pair)', ZX + 15, ZY + 3, ZZ - 10, 'pad'); P('ZK-LM', 'L', '<b>ZK-502M</b> speaker terminal L (second of the pair, not ground!)', ZX + 15, ZY + 3, ZZ - 6, 'pad');
// SIM868 (Waveshare Pico-SIM868, Pico removed) on edge at the back wall: same as the perfboard guide
const SIMZ = -68, SIMY0 = 9, SIMY1 = 33, ROWT = 29.9, ROWB = 12.1, SOCK = SIMZ + 8.5;
const simpin = n => n <= 20 ? [34.4 - (n - 1) * 2.54, ROWT, SOCK] : [34.4 - (40 - n) * 2.54, ROWB, SOCK];
[[1, 'GP0 / RXD'], [2, 'GP1 / TXD'], [18, 'GND'], [19, 'GP14 / PWRKEY'], [36, '3V3(OUT)']].forEach(([n, w]) => P('SIM-' + n, 'pin ' + n, `<b>SIM868</b> ${w}`, ...simpin(n), 'sock'));
P('SIM-BAT+', 'BAT +', '<b>SIM868</b> PH2.0 battery socket (red)', 17.2, 24, -58, 'pad'); P('SIM-BAT-', 'BAT −', '<b>SIM868</b> PH2.0 battery socket (black)', 14.8, 24, -58, 'pad');
// power: the power bank (outside the case) is the only source. Its cut USB-A cable enters through a grommet in the left wall:
// red → rocker → 5 V star splice, black → GND star splice (both with C3, in the old boost pocket).
// The SIM868 gets 4.0 V from an STP28UD-3A step-down lying where the 18650 holder used to be.
P('USB+', 'USB red', '<b>USB cable</b> red core (power bank 5 V), just inside the grommet', -73.0, 6.5, 39.6, 'pad');
P('USB-', 'USB black', '<b>USB cable</b> black core (power bank GND), just inside the grommet', -74.0, 5.5, 41.4, 'pad');
P('SP+', '5V ✱', '<b>5 V splice</b> (rocker lead + C3 + + step-down IN+ + 4 leads)', -8.5, 4.6, 54, 'pad'); P('SP-', 'GND ✱', '<b>GND splice</b> (USB black + C3 − + step-down IN− + 3 leads)', -8.5, 4.6, 63, 'pad');
P('R-1', 'pin 1', '<b>Rocker</b> lug', 65.5, 11.7, 4.5, 'pad'); P('R-2', 'pin 2', '<b>Rocker</b> lug', 65.5, 18.7, 8.5, 'pad');
P('BK-IN+', 'IN+', '<b>Step-down</b> pad', -30, 4.6, 32, 'pad'); P('BK-IN-', 'IN−', '<b>Step-down</b> pad', -30, 4.6, 39, 'pad');
P('BK-OUT+', 'OUT+', '<b>Step-down</b> pad (4.0 V)', 17, 4.6, 32, 'pad'); P('BK-OUT-', 'OUT−', '<b>Step-down</b> pad', 17, 4.6, 39, 'pad');

}

    const blk = wires.filter(w => w.kind === 'ph' && w.net === 'gnd').reduce((a, w) => a + r5(w.len + 20), 0);
    h += `<div class="sec">What to take from the stock</div><table class="tot">
      <tr><td>F-F jumpers 10 cm (stock row 42)</td><td class="q">${ff}</td></tr><tr><td>M-F jumpers 10 cm (stock row 39)</td><td class="q">${mf}</td></tr>
      <tr><td>6×0.22 cable, two cores (stock row 359)</td><td class="q">${pairL} mm</td></tr><tr><td>0.5 mm² red (stock row 353)</td><td class="q">${red} mm</td></tr>
      <tr><td>0.5 mm² black (stock row 352)</td><td class="q">${blk} mm</td></tr><tr><td>Male pin header strip (stock row 130)</td><td class="q">6 pins</td></tr>
      <tr><td>PH2.0 2-pin plug with leads (buy)</td><td class="q">1</td></tr><tr><td>470 µF (C3) · 1000 µF (step-down output) · 1 kΩ · 1N4001</td><td class="q">1 each</td></tr><tr><td>Power bank · USB-A cable (any, far end cut off) · STP28UD-3A step-down (stock row 291)</td><td class="q">1 each</td></tr><tr><td>ZK-502M amp · 3.5 mm male–male AUX cable</td><td class="q">1 each</td></tr></table>`;
    h += `<div class="sec">Every wire</div>`;
    steps.forEach((st, i) => { const list = stepWires(i); if (!list.length) return;
      list.forEach((w, j) => { h += `<div class="op" data-w="${w.id}"><span class="n">${i + 1}.${j + 1}</span><div><div class="end"><span class="sw" style="background:${w.color}"></span><b>${PIN[w.a].tag}</b> <span class="what">${plain(PIN[w.a].what)}</span> → <b>${PIN[w.b].tag}</b> <span class="what">${plain(PIN[w.b].what)}</span></div><div class="meta">${w.cut}</div></div></div>`; }); });
  }

  card.innerHTML = h; card.scrollTop = 0;
  card.querySelectorAll('[data-w]').forEach(el => { el.onmouseenter = () => { hoverWire = +el.dataset.w; apply(); }; el.onmouseleave = () => { hoverWire = null; apply(); }; });
  document.getElementById('prev').disabled = cur === 0;

function go(i) {

document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
document.getElementById('bLabels').onclick = e => { showLabels = !showLabels; e.currentTarget.classList.toggle('on', showLabels); apply(); };
document.getElementById('bXray').onclick = e => { xray = !xray; e.currentTarget.classList.toggle('on', xray); apply(); };

document.getElementById('bReset').onclick = () => flyTo(steps[cur].view);
document.getElementById('legend').innerHTML = LEGEND.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');

/* ======================= camera ======================= */
const camS = { t: v(0, 8, 0), r: 360, th: 0.5, ph: 0.9 }; let camGoal = null; const D = Math.PI / 180;

function camApply() {
  const s = Math.sin(camS.ph);
  camera.position.set(camS.t.x + camS.r * s * Math.sin(camS.th), camS.t.y + camS.r * Math.cos(camS.ph), camS.t.z + camS.r * s * Math.cos(camS.th));

let drag = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; camGoal = null; });
canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) { const k = camS.r / canvas.clientHeight * 0.9; const right = v(Math.cos(camS.th), 0, -Math.sin(camS.th)), fwd = v(Math.sin(camS.th), 0, Math.cos(camS.th));

  else { camS.th -= dx * 0.006; camS.ph = Math.max(0.03, Math.min(3.11, camS.ph - dy * 0.006)); } });
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => { e.preventDefault(); camGoal = null; camS.r = Math.max(30, Math.min(1400, camS.r * Math.exp(e.deltaY * 0.0012))); }, { passive: false });

/* ======================= loop ======================= */
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight;
  const pr = renderer.getPixelRatio(); if (canvas.width !== Math.round(w * pr) || canvas.height !== Math.round(h * pr)) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); } }
const tmp = new THREE.Vector3(); let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; resize();
  if (camGoal) { const k = 1 - Math.pow(0.0015, dt);
    camS.t.lerp(camGoal.t, k); camS.r += (camGoal.r - camS.r) * k;
    let dth = camGoal.th - camS.th; dth = Math.atan2(Math.sin(dth), Math.cos(dth)); camS.th += dth * k; camS.ph += (camGoal.ph - camS.ph) * k;
    if (Math.abs(camGoal.r - camS.r) < 0.3 && Math.abs(dth) < 0.001 && camS.t.distanceTo(camGoal.t) < 0.1 && Math.abs(camGoal.ph - camS.ph) < 0.001) camGoal = null; }

  const kl = 1 - Math.pow(0.002, dt); lidG.position.lerp(lidGoal.p, kl); lidG.quaternion.slerp(lidGoal.q, kl);
  renderer.render(scene, camera);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const placed = [];
  labelItems.forEach(it => { tmp.copy(it.pos); if (it.parent === lidG) tmp.applyMatrix4(lidG.matrixWorld); tmp.project(camera);
    if (tmp.z > 1 || tmp.z < -1) { it.el.style.display = 'none'; return; } it.el.style.display = '';
    if (!it.w) { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; }
    let x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h, dy = 0;
    for (let k = 0; k < 12; k++) { const top = y - it.h - 6 - dy, l = x - it.w / 2;
      const hit = placed.find(r => l < r.r && l + it.w > r.l && top < r.b && top + it.h > r.t); if (!hit) break; dy += it.h + 2; }
    placed.push({ l: x - it.w / 2, r: x + it.w / 2, t: y - it.h - 6 - dy, b: y - 6 - dy });
    it.el.style.left = x + 'px'; it.el.style.top = (y - dy) + 'px';
    it.el.style.borderBottom = dy ? '2px solid #f2d49b' : ''; });
  requestAnimationFrame(tick);
}
const m0 = /s=(\d+)/.exec(location.hash);
go(m0 ? +m0[1] - 1 : 0);
{ const g = camGoal; if (g) { camS.t.copy(g.t); camS.r = g.r; camS.th = g.th; camS.ph = g.ph; } }
if (steps[cur].lidPose === 'flat') { lidG.position.copy(LID_FLAT.p); lidG.quaternion.copy(LID_FLAT.q); }
requestAnimationFrame(tick);
